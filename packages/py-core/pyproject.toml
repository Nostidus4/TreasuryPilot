[project]
name = "treasurypilot-core"
version = "0.1.0"
description = "Pure domain types and deterministic treasury logic for TreasuryPilot."
requires-python = ">=3.12,<3.13"
dependencies = [
    "eth-abi>=5.2,<6",
    "eth-hash[pycryptodome]>=0.7,<1",
    "pydantic>=2.10,<3",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/treasurypilot_core"]
