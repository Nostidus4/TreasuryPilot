[project]
name = "treasurypilot-core"
version = "0.1.0"
description = "Pure domain types and deterministic treasury logic for TreasuryPilot."
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=46,<47",
    "eth-abi>=5.2,<6",
    "eth-account>=0.13.7,<0.14",
    "eth-hash[pycryptodome]>=0.7,<1",
    "opentelemetry-api>=1.45,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
    "opentelemetry-sdk>=1.45,<2",
    "ortools==9.14.6206",
    "pydantic>=2.10,<3",
    "sentry-sdk>=2,<3",
    "structlog>=25,<26",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/treasurypilot_core"]
