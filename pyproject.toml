[project]
name = "treasurypilot"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "treasurypilot-api",
    "treasurypilot-core",
    "treasurypilot-signer",
    "treasurypilot-worker",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "hypothesis>=6.115,<7",
    "import-linter==2.3",
    "mypy>=1.15,<2",
    "pre-commit==4.2.0",
    "pytest==8.3.5",
    "pytest-cov>=6,<7",
    "ruff==0.11.13",
    "types-pyyaml>=6,<7",
]

[tool.uv]
package = false
required-version = "==0.11.3"

[tool.uv.sources]
treasurypilot-api = { workspace = true }
treasurypilot-core = { workspace = true }
treasurypilot-signer = { workspace = true }
treasurypilot-worker = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/*",
    "services/*",
]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["packages", "services", "infra/scripts/tests"]
markers = ["integration: requires a live infrastructure dependency"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
    "packages/py-core/src",
    "services/api/src",
    "services/signer/src",
    "services/worker/src",
]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = [
    "treasurypilot_api",
    "treasurypilot_core",
    "treasurypilot_signer",
    "treasurypilot_worker",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "py-core has no I/O framework dependencies"
type = "forbidden"
source_modules = ["treasurypilot_core"]
forbidden_modules = ["celery", "fastapi", "httpx", "sqlalchemy", "web3"]

[[tool.importlinter.contracts]]
name = "Services are independent"
type = "independence"
modules = ["treasurypilot_api", "treasurypilot_signer", "treasurypilot_worker"]

[[tool.importlinter.contracts]]
name = "AI worker cannot import signing code"
type = "forbidden"
source_modules = ["treasurypilot_worker.agent"]
forbidden_modules = ["treasurypilot_signer"]
