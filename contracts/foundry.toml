[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["node_modules"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fuzz = { runs = 1000 }

remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@safe-global/safe-contracts/=node_modules/@safe-global/safe-contracts/",
]
