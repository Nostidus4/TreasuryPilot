[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["node_modules"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
additional_compiler_profiles = [{ name = "module-ir", via_ir = true }]
compilation_restrictions = [
  { paths = "src/TreasuryPilotModule.sol", via_ir = true },
  { paths = "node_modules/@safe-global/safe-contracts/contracts/Safe.sol", via_ir = false },
]
bytecode_hash = "none"
fuzz = { runs = 1000 }
invariant = { runs = 1000, depth = 32, fail_on_revert = true }
fs_permissions = [{ access = "read", path = "test/vectors" }]
no_match_path = "test/fork/**"

remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@safe-global/safe-contracts/=node_modules/@safe-global/safe-contracts/",
]

[profile.ci]
fuzz = { runs = 10000 }
invariant = { runs = 10000, depth = 32, fail_on_revert = true }

[profile.fork]
no_match_path = "test/invariant/**"
match_path = "test/fork/**"

[profile.deploy]
fs_permissions = [{ access = "read", path = "test/vectors" }, { access = "read-write", path = "../deployments" }]
