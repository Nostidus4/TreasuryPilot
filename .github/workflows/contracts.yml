name: Contracts CI

on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/contracts.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/contracts.yml'

permissions:
  contents: read

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: Install Solidity dependencies
        run: pnpm install --frozen-lockfile
      - name: Format
        working-directory: contracts
        run: forge fmt --check
      - name: Build
        working-directory: contracts
        run: forge build
      - name: Test
        working-directory: contracts
        env:
          FOUNDRY_FUZZ_RUNS: ${{ github.ref == 'refs/heads/main' && '10000' || '1000' }}
        run: |
          {
            echo "Revision: $GITHUB_SHA; profile: default; solc: 0.8.28; optimizer: 200; module: IR"
            forge --version
            forge test --gas-report -vv
          } | tee gas-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: contracts-gas-report
          path: contracts/gas-report.txt
