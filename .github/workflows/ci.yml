name: Python CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  execution-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: treasurypilot
          POSTGRES_PASSWORD: treasurypilot
          POSTGRES_DB: treasurypilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U treasurypilot -d treasurypilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TP_TEST_DATABASE_URL: postgresql+asyncpg://treasurypilot:treasurypilot@localhost:5432/treasurypilot
      TP_REQUIRE_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Solidity dependencies
        run: pnpm install --frozen-lockfile --filter @treasurypilot/contracts...
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: Build the contracts used by the worker Anvil tests
        working-directory: contracts
        run: >-
          forge build src/test-assets/TestUSDC.sol src/test-assets/MockAavePool.sol
          test/helpers/ReconcileModuleStandIn.sol
      - name: Install Python workspace
        run: uv sync --frozen
      # This job (with Anvil) is the one that runs the Anvil planning test in
      # test_pipeline_integration.py; the Postgres-only job below skips it (no anvil binary).
      - name: Run execution API and Anvil integration tests
        run: >-
          uv run pytest -q
          services/api/tests/test_execution_routes_postgres.py
          services/api/tests/test_run_now_postgres.py
          services/worker/tests/test_tracker_integration.py
          services/worker/tests/test_event_indexer_integration.py
          services/worker/tests/test_recovery_resolve.py
          services/worker/tests/reconcile/test_verify_anvil.py
          services/worker/tests/test_recovery_partial_anvil.py
          services/worker/tests/planner/test_pipeline_integration.py
          services/worker/tests/test_recovery_crash_suite.py

  audit-evidence-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: treasurypilot
          POSTGRES_PASSWORD: treasurypilot
          POSTGRES_DB: treasurypilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U treasurypilot -d treasurypilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TP_TEST_DATABASE_URL: postgresql+asyncpg://treasurypilot:treasurypilot@localhost:5432/treasurypilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
          enable-cache: true
      - name: Install Python workspace
        run: uv sync --frozen
      - name: PostgreSQL evidence exporter integration
        run: uv run pytest services/api/tests/test_audit_evidence_postgres.py
      - name: Mandate expiry sweep PostgreSQL integration
        run: uv run pytest services/worker/tests/test_mandate_expiry.py
      - name: Outbox executor PostgreSQL integration
        run: uv run pytest services/worker/tests/executor/test_outbox_integration.py
      - name: Pause routes PostgreSQL integration
        run: uv run pytest services/api/tests/test_pause_postgres.py
      - name: Step sequencer and post-condition PostgreSQL integration
        run: uv run pytest services/worker/tests/executor/test_sequencer_integration.py
      - name: Reconciliation records PostgreSQL integration
        run: uv run pytest services/worker/tests/reconcile/test_build_integration.py
      - name: EAS payment receipts PostgreSQL integration
        run: uv run pytest services/worker/tests/reconcile/test_receipt_integration.py
      - name: Reconciliation match routes PostgreSQL integration
        run: uv run pytest services/api/tests/test_reconciliation_postgres.py
      - name: Plan gate PostgreSQL integration
        run: uv run pytest services/worker/tests/executor/test_gate_integration.py
      - name: Treasury partitioning PostgreSQL load test
        run: uv run pytest services/worker/tests/test_partitioning.py services/worker/tests/test_locks.py
      - name: Planning pipeline PostgreSQL integration
        run: uv run pytest services/worker/tests/planner/test_pipeline_integration.py
      - name: Liquidity cycle PostgreSQL integration
        run: uv run pytest services/worker/tests/planner/test_liquidity_cycle_integration.py
      - name: Circuit breaker PostgreSQL integration
        run: uv run pytest services/worker/tests/test_circuit_breaker_integration.py
      - name: Low-gas sweep PostgreSQL integration
        run: uv run pytest services/worker/tests/test_low_gas_postgres.py

  retention-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: treasurypilot_test
          POSTGRES_USER: treasurypilot
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U treasurypilot -d treasurypilot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
          enable-cache: true
      - name: Install Python workspace
        run: uv sync --frozen
      - name: Retention PostgreSQL integration
        env:
          TP_TEST_DATABASE_URL: postgresql+asyncpg://treasurypilot:test-only-password@localhost:5432/treasurypilot_test
        run: uv run pytest services/api/tests/test_retention.py

  invoice-email-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: treasurypilot_test
          POSTGRES_USER: treasurypilot
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U treasurypilot -d treasurypilot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
          enable-cache: true
      - name: Install Python workspace
        run: uv sync --frozen
      - name: Invoice upload, email intake, and Travel Rule PostgreSQL integration
        env:
          TP_TEST_DATABASE_URL: postgresql+asyncpg://treasurypilot:test-only-password@localhost:5432/treasurypilot_test
        run: >-
          uv run pytest
          services/api/tests/test_invoice_documents_postgres.py
          services/api/tests/test_invoice_approval_api.py
          services/api/tests/test_threshold_approvals_postgres.py
          services/api/tests/test_payees_postgres.py
          services/worker/tests/test_invoice_extraction_integration.py
          services/api/tests/test_operations_metrics.py
          services/api/tests/test_savings_report.py
          services/api/tests/test_treasury_forecast_postgres.py
          services/worker/tests/test_exception_draft_integration.py
          services/api/tests/test_usage_metering.py
          services/api/tests/test_reconciliation_export_integration.py
          -q

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
          enable-cache: true
      # Anvil for the on-chain integration tests (asset decimals check).
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: Install SAML XML signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xmlsec1
      - name: Install Python workspace
        run: uv sync --frozen
      - name: Ruff
        run: |
          uv run ruff check packages services infra/scripts infra/minio-init
          uv run ruff format --check packages services infra/scripts infra/minio-init
      - name: Type check
        run: uv run mypy packages/py-core/src services/api/src services/worker/src services/signer/src infra/scripts
      - name: Module boundaries
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest --cov=treasurypilot_core --cov-report=term-missing

  treasury-setup-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tp
          POSTGRES_PASSWORD: tp
          POSTGRES_DB: tp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tp -d tp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Solidity dependencies
        run: pnpm install --frozen-lockfile --filter @treasurypilot/contracts...
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
          enable-cache: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - uses: actions/cache@v4
        with:
          path: |
            ~/.svm
            contracts/cache
          key: foundry-solc-${{ runner.os }}-v1.8.5-${{ hashFiles('contracts/foundry.toml', 'pnpm-lock.yaml') }}
      - name: Install Python workspace
        run: uv sync --frozen
      - name: Owner treasury setup over live API, Safe contracts and coverage worker
        env:
          TP_TEST_DATABASE_URL: postgresql+asyncpg://tp:tp@localhost:5432/tp_test
        run: uv run pytest -q services/api/tests/test_treasury_setup_anvil.py

  scim-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: treasurypilot_test
          POSTGRES_USER: treasurypilot
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U treasurypilot -d treasurypilot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
          enable-cache: true
      - name: Install Python workspace
        run: uv sync --frozen
      - name: Identity PostgreSQL integrations
        env:
          TP_TEST_DATABASE_URL: postgresql+asyncpg://treasurypilot:test-only-password@localhost:5432/treasurypilot_test
        run: >-
          uv run pytest
          services/api/tests/test_scim_postgres.py
          services/api/tests/test_saml_postgres.py
          infra/scripts/tests/test_seed_local.py

  scenario-anvil:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tp
          POSTGRES_PASSWORD: tp
          POSTGRES_DB: tp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tp -d tp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Solidity dependencies
        run: pnpm install --frozen-lockfile --filter @treasurypilot/contracts...
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
          enable-cache: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - uses: actions/cache@v4
        with:
          path: |
            ~/.svm
            contracts/cache
          key: foundry-solc-${{ runner.os }}-v1.8.5-${{ hashFiles('contracts/foundry.toml', 'pnpm-lock.yaml') }}
      - name: Install Python workspace
        run: uv sync --frozen
      - name: Start Anvil
        run: |
          anvil --silent --chain-id 31337 --port 8545 > /tmp/treasurypilot-anvil.log 2>&1 &
          for attempt in $(seq 1 40); do
            cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1 && exit 0
            sleep 1
          done
          cat /tmp/treasurypilot-anvil.log
          exit 1
      - name: Deploy contracts to Anvil
        run: infra/scripts/deploy-local.sh
      - name: AT-04 gas-shortage swap on the TEST ROUTER (planner, sequencer, tracker, real module)
        env:
          TP_TEST_ANVIL_URL: http://127.0.0.1:8545
          TP_TEST_DATABASE_URL: postgresql+asyncpg://tp:tp@localhost:5432/tp_test
          TP_REQUIRE_INTEGRATION: '1'
        run: uv run pytest -q -rs services/worker/tests/executor/test_swap_for_gas_anvil.py
      - name: Run every scenario on Anvil
        env:
          TP_TEST_ANVIL_URL: http://127.0.0.1:8545
        run: |
          # Each run reverts to an Anvil snapshot, so one deployment serves every scenario twice.
          uv run pytest -q infra/scripts/tests/test_scenario.py
          for name in $(uv run python infra/scripts/scenario.py list | awk '{print $1}'); do
            uv run python infra/scripts/scenario.py run "$name" --out /tmp/scenario-evidence
          done
      - name: Reliability harness smoke (3 runs)
        run: |
          uv run python infra/scripts/reliability.py --local-runs 3 --out-dir /tmp/reliability
          grep -q 'completion: 100.0%' /tmp/reliability/reliability-*.md
      - name: Refuse a non-allowlisted chain
        run: |
          anvil --silent --chain-id 1 --port 8546 > /tmp/treasurypilot-anvil-mainnet.log 2>&1 &
          for attempt in $(seq 1 40); do
            cast chain-id --rpc-url http://127.0.0.1:8546 >/dev/null 2>&1 && break
            sleep 1
          done
          if uv run python infra/scripts/scenario.py run demo-main --rpc-url http://127.0.0.1:8546 2> /tmp/refused.txt; then
            echo 'a mainnet chain id was not refused' >&2
            exit 1
          fi
          grep -q 'refusing to run: RPC serves chain id 1' /tmp/refused.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-evidence
          path: /tmp/scenario-evidence
          if-no-files-found: ignore

  # Live-RPC check kept out of `quality` so a public RPC outage cannot block unit tests.
  config-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
          enable-cache: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: Install Python workspace
        run: uv sync --frozen
      - name: Deployment config gate
        env:
          SEPOLIA_RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
        run: |
          for attempt in 1 2 3; do
            make config-check && exit 0
            sleep $((attempt * 10))
          done
          exit 1

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
