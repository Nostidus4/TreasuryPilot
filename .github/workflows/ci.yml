name: Python CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
          enable-cache: true
      # Anvil for the on-chain integration tests (asset decimals check).
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: Install Python workspace
        run: uv sync --frozen
      - name: Ruff
        run: |
          uv run ruff check packages services infra/scripts infra/minio-init
          uv run ruff format --check packages services infra/scripts infra/minio-init
      - name: Type check
        run: uv run mypy packages/py-core/src services/api/src services/worker/src services/signer/src infra/scripts
      - name: Module boundaries
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest --cov=treasurypilot_core --cov-report=term-missing

  treasury-setup-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tp
          POSTGRES_PASSWORD: tp
          POSTGRES_DB: tp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tp -d tp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Solidity dependencies
        run: pnpm install --frozen-lockfile --filter @treasurypilot/contracts...
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
          enable-cache: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - uses: actions/cache@v4
        with:
          path: |
            ~/.svm
            contracts/cache
          key: foundry-solc-${{ runner.os }}-v1.8.5-${{ hashFiles('contracts/foundry.toml', 'pnpm-lock.yaml') }}
      - name: Install Python workspace
        run: uv sync --frozen
      - name: Owner treasury setup over live API, Safe contracts and coverage worker
        env:
          TP_TEST_DATABASE_URL: postgresql+asyncpg://tp:tp@localhost:5432/tp_test
        run: uv run pytest -q services/api/tests/test_treasury_setup_anvil.py

  # Live-RPC check kept out of `quality` so a public RPC outage cannot block unit tests.
  config-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
          enable-cache: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: Install Python workspace
        run: uv sync --frozen
      - name: Deployment config gate
        env:
          SEPOLIA_RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
        run: |
          for attempt in 1 2 3; do
            make config-check && exit 0
            sleep $((attempt * 10))
          done
          exit 1

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
