name: Python CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  audit-evidence-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: treasurypilot
          POSTGRES_PASSWORD: treasurypilot
          POSTGRES_DB: treasurypilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U treasurypilot -d treasurypilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TP_TEST_DATABASE_URL: postgresql+asyncpg://treasurypilot:treasurypilot@localhost:5432/treasurypilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
          enable-cache: true
      - name: Install Python workspace
        run: uv sync --frozen
      - name: PostgreSQL evidence exporter integration
        run: uv run pytest services/api/tests/test_audit_evidence_postgres.py

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
          enable-cache: true
      # Anvil for the on-chain integration tests (asset decimals check).
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: Install Python workspace
        run: uv sync --frozen
      - name: Ruff
        run: |
          uv run ruff check packages services infra/scripts infra/minio-init
          uv run ruff format --check packages services infra/scripts infra/minio-init
      - name: Type check
        run: uv run mypy packages/py-core/src services/api/src services/worker/src services/signer/src infra/scripts
      - name: Module boundaries
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest --cov=treasurypilot_core --cov-report=term-missing

  # Live-RPC check kept out of `quality` so a public RPC outage cannot block unit tests.
  config-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
          enable-cache: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: Install Python workspace
        run: uv sync --frozen
      - name: Deployment config gate
        env:
          SEPOLIA_RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
        run: |
          for attempt in 1 2 3; do
            make config-check && exit 0
            sleep $((attempt * 10))
          done
          exit 1

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
