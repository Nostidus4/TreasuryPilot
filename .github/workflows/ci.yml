name: Python CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
          enable-cache: true
      # Anvil for the on-chain integration tests (asset decimals check).
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: Install SAML XML signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xmlsec1
      - name: Install Python workspace
        run: uv sync --frozen
      - name: Ruff
        run: |
          uv run ruff check packages services infra/scripts infra/minio-init
          uv run ruff format --check packages services infra/scripts infra/minio-init
      - name: Type check
        run: uv run mypy packages/py-core/src services/api/src services/worker/src services/signer/src infra/scripts
      - name: Module boundaries
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest --cov=treasurypilot_core --cov-report=term-missing

  retention-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: treasurypilot_test
          POSTGRES_USER: treasurypilot
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U treasurypilot -d treasurypilot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
          enable-cache: true
      - name: Install Python workspace
        run: uv sync --frozen
      - name: Retention PostgreSQL integration
        env:
          TP_TEST_DATABASE_URL: postgresql+asyncpg://treasurypilot:test-only-password@localhost:5432/treasurypilot_test
        run: uv run pytest services/api/tests/test_retention.py

  invoice-email-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: treasurypilot_test
          POSTGRES_USER: treasurypilot
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U treasurypilot -d treasurypilot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
          enable-cache: true
      - name: Install Python workspace
        run: uv sync --frozen
      - name: Invoice upload, email intake, and Travel Rule PostgreSQL integration
        env:
          TP_TEST_DATABASE_URL: postgresql+asyncpg://treasurypilot:test-only-password@localhost:5432/treasurypilot_test
        run: >-
          uv run pytest
          services/api/tests/test_invoice_documents_postgres.py
          services/api/tests/test_invoice_approval_api.py
          services/api/tests/test_payees_postgres.py
          -q

  scim-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: treasurypilot_test
          POSTGRES_USER: treasurypilot
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U treasurypilot -d treasurypilot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
          enable-cache: true
      - name: Install Python workspace
        run: uv sync --frozen
      - name: SCIM PostgreSQL integration
        env:
          TP_TEST_DATABASE_URL: postgresql+asyncpg://treasurypilot:test-only-password@localhost:5432/treasurypilot_test
        run: uv run pytest services/api/tests/test_scim_postgres.py

  # Live-RPC check kept out of `quality` so a public RPC outage cannot block unit tests.
  config-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
          enable-cache: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: Install Python workspace
        run: uv sync --frozen
      - name: Deployment config gate
        env:
          SEPOLIA_RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
        run: |
          for attempt in 1 2 3; do
            make config-check && exit 0
            sleep $((attempt * 10))
          done
          exit 1

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
