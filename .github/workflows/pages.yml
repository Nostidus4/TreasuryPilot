name: Deploy web app and technical report to GitHub Pages

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'docs/TECHNICAL_REPORT_EN.md'
      - 'docs/TECHNICAL_REPORT_VI.md'
      - 'docs/TECHNICAL_REPORT_ZH.md'
      - 'docs/report_site/**'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'docs/TECHNICAL_REPORT_EN.md'
      - 'docs/TECHNICAL_REPORT_VI.md'
      - 'docs/TECHNICAL_REPORT_ZH.md'
      - 'docs/report_site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Keep pull request validation independent so one PR cannot cancel another.
  # Pushes and manual runs still share a group per ref to avoid stale deploys.
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate static web app
        env:
          VITE_BASE_PATH: /TreasuryPilot/
        run: |
          pnpm --dir apps/web lint
          pnpm --dir apps/web typecheck
          pnpm --dir apps/web test
          pnpm --dir apps/web build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate trilingual report
        run: |
          python -m pip install -r docs/report_site/requirements.txt
          python docs/report_site/build.py --output apps/web/dist/report

  deploy:
    if: github.event_name != 'pull_request'
    # Serialize deploys across refs; the workflow-level group only isolates validation.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build static web app
        env:
          VITE_BASE_PATH: /TreasuryPilot/
        run: pnpm --dir apps/web build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build trilingual report under /report
        run: |
          python -m pip install -r docs/report_site/requirements.txt
          python docs/report_site/build.py --output apps/web/dist/report
      - name: Add SPA fallback
        run: cp apps/web/dist/index.html apps/web/dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
