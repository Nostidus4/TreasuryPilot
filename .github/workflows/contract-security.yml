name: Contract security evidence
on:
  pull_request:
    paths:
      [
        'contracts/**',
        'pnpm-lock.yaml',
        '.github/workflows/contract-security.yml',
      ]
  push:
    branches: [main]
    paths:
      [
        'contracts/**',
        'pnpm-lock.yaml',
        '.github/workflows/contract-security.yml',
      ]
permissions:
  contents: read
jobs:
  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
      - run: pnpm install --frozen-lockfile
      - name: Independent EIP-712 vectors must reproduce
        working-directory: contracts
        run: |
          node tools/generate-vectors.cjs
          git diff --exit-code -- test/vectors
      - name: Analyze all production code without blanket detector exclusions
        working-directory: contracts
        run: uv tool run --from slither-analyzer==0.11.3 slither . --compile-force-framework foundry --filter-paths 'test|script|src/test-assets' --exclude-dependencies --fail-none --json slither.json
      - name: Fail on every unreviewed High or Medium finding
        working-directory: contracts
        run: |
          python -m unittest discover -s tools -p 'test_*.py'
          python tools/check_slither.py slither.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slither-contracts
          path: contracts/slither.json
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - run: pnpm install --frozen-lockfile
      - name: I1-I14 at 10,000 runs and 32 calls per run
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: ci
        run: forge test --match-contract TreasuryInvariantTest -vv
