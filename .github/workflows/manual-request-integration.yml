name: Manual Request PostgreSQL Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  request-edit-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: treasurypilot_test
          POSTGRES_USER: treasurypilot
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U treasurypilot -d treasurypilot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
          enable-cache: true
      - name: Install Python workspace
        run: uv sync --frozen
      - name: Manual request PostgreSQL integration
        env:
          TP_TEST_DATABASE_URL: postgresql+asyncpg://treasurypilot:test-only-password@localhost:5432/treasurypilot_test
        run: uv run pytest services/api/tests/test_invoice_request_edit.py -q
