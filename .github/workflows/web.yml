name: Web CI

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'services/api/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/web.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'services/api/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/web.yml'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
          enable-cache: true
      - name: Install workspaces
        run: |
          uv sync --frozen
          pnpm install --frozen-lockfile
      - name: Regenerate OpenAPI client
        run: |
          make openapi
          git diff --exit-code -- apps/web/openapi.json apps/web/src/lib/api/schema.d.ts
      - name: Lint, typecheck and test
        run: |
          pnpm --dir apps/web lint
          pnpm --dir apps/web typecheck
          pnpm --dir apps/web test
      - name: Build
        run: pnpm --dir apps/web build
      - name: Start local Anvil
        run: docker compose --env-file infra/env/.env.example -f infra/compose.yaml --profile local up --detach --wait anvil
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm --dir apps/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browser
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Run browser flow
        env:
          E2E_ANVIL_RPC_URL: http://127.0.0.1:8545
        run: pnpm --dir apps/web e2e
      - name: Stop local Anvil
        if: always()
        run: docker compose --env-file infra/env/.env.example -f infra/compose.yaml --profile local rm --stop --force --volumes anvil
