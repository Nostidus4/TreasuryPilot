name: Evaluation fixtures
on:
  pull_request:
    paths: ['evals/**', 'Makefile', '.github/workflows/evals.yml']
  push:
    branches: [main]
    paths: ['evals/**', 'Makefile', '.github/workflows/evals.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.3'
      - name: Validate synthetic data and independent labels
        run: make eval-validate
      - name: Check fixture authoring code
        run: |
          uv run --frozen ruff check evals
          uv run --frozen ruff format --check evals
