name: Bug
description: Something behaves differently from the spec
title: "[MODULE] Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes: {label: What happened vs what was expected}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: Steps to reproduce}
    validations: {required: true}
  - type: input
    id: refs
    attributes: {label: Related FR / BR / issue}
  - type: dropdown
    id: money
    attributes: {label: Does it affect money or authority?, options: ["No", "Yes: treat as security-sensitive"]}
    validations: {required: true}
