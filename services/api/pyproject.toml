[project]
name = "treasurypilot-api"
version = "0.1.0"
description = "TreasuryPilot HTTP API service."
requires-python = ">=3.12,<3.13"
dependencies = [
    "abnf>=2.2,<2.3", # siwe 4.4.0 grammar is incompatible with newer ABNF releases
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "opentelemetry-instrumentation-fastapi>=0.66b1,<1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1,<1",
    "pydantic-settings>=2.7,<3",
    "redis>=5.2,<7",
    "sqlalchemy[asyncio]>=2.0,<3",
    "siwe>=4.4,<5",
    "treasurypilot-core",
    "uvicorn[standard]>=0.34,<1",
]

[tool.uv.sources]
treasurypilot-core = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/treasurypilot_api"]
