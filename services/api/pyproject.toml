[project]
name = "treasurypilot-api"
version = "0.1.0"
description = "TreasuryPilot HTTP API service."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "celery[redis]>=5.5,<6",
    "fastapi>=0.115,<1",
    "minio==7.2.18",
    "pillow>=11,<12",
    "pypdf>=5.4,<6",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "redis>=5.2,<7",
    "sqlalchemy[asyncio]>=2.0,<3",
    "treasurypilot-core",
    "uvicorn[standard]>=0.34,<1",
]

[tool.uv.sources]
treasurypilot-core = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/treasurypilot_api"]
