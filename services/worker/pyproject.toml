[project]
name = "treasurypilot-worker"
version = "0.1.0"
description = "TreasuryPilot core and AI worker package."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1,<2",
    "celery[redis]>=5.5,<6",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pyyaml>=6,<7",
    "treasurypilot-core",
]

[tool.uv.sources]
treasurypilot-core = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/treasurypilot_worker"]
