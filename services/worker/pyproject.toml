[project]
name = "treasurypilot-worker"
version = "0.1.0"
description = "TreasuryPilot core and AI worker package."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1,<2",
    "aiohttp>=3.9,<4",
    "asyncpg>=0.30,<1",
    "celery[redis]>=5.5,<6",
    "eth-abi>=5.2,<6",
    "minio==7.2.18",
    "opentelemetry-instrumentation-celery>=0.66b1,<1",
    "opentelemetry-instrumentation-httpx>=0.66b1,<1",
    "prometheus-client>=0.21,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pypdf>=5.4,<6",
    "pyyaml>=6,<7",
    "sentry-sdk>=2,<3",
    "treasurypilot-core",
    "web3>=7,<8",
]

[tool.uv.sources]
treasurypilot-core = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/treasurypilot_worker"]
