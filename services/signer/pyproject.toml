[project]
name = "treasurypilot-signer"
version = "0.1.0"
description = "TreasuryPilot internal signing-service package."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "opentelemetry-instrumentation-fastapi>=0.66b1,<1",
    "pydantic-settings>=2.7,<3",
    "treasurypilot-core",
    "uvicorn[standard]>=0.34,<1",
]

[tool.uv.sources]
treasurypilot-core = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/treasurypilot_signer"]
