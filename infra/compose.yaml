name: treasurypilot

x-python-build: &python-build
  context: ..

x-app-environment: &app-environment
  TP_ENVIRONMENT: local
  TP_REDIS_URL: redis://redis:6379/0
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
  S3_ENDPOINT_URL: http://minio:9000
  # Browser-reachable endpoint used only to presign document reads.
  S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
  S3_BUCKET: ${MINIO_BUCKET:?set MINIO_BUCKET}
  # Empty: spans are created (trace_id in logs) but not exported.
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  # Unhandled errors also ping Telegram when both are set and SENTRY_DSN is too (OBS-003).
  TP_TELEGRAM_BOT_TOKEN: ${TP_TELEGRAM_BOT_TOKEN:-}
  TP_TELEGRAM_ALERT_CHAT_ID: ${TP_TELEGRAM_ALERT_CHAT_ID:-}
  # Local-only: reuses the MinIO root credentials. Deployments must set dedicated app keys.
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [public, internal]

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'no', '--save', '']
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [public, internal]

  minio:
    build:
      context: ..
      dockerfile: infra/minio/Dockerfile
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [public, internal]

  minio-init:
    build:
      context: ..
      dockerfile: infra/minio-init/Dockerfile
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:?set MINIO_BUCKET}
    restart: 'no'
    networks: [internal]

  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.8.5
    profiles: [local, ci]
    entrypoint: ['anvil']
    command:
      - --host
      - 0.0.0.0
      - --chain-id
      - '31337'
      - --mnemonic
      - test test test test test test test test test test test junk
      - --block-time
      - '1'
    ports:
      - '127.0.0.1:8545:8545'
    healthcheck:
      test: ['CMD', 'cast', 'chain-id', '--rpc-url', 'http://127.0.0.1:8545']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [public, internal]

  migrate:
    build:
      <<: *python-build
      dockerfile: services/api/Dockerfile
    command: ['alembic', '-c', 'services/api/alembic.ini', 'upgrade', 'head']
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks: [internal]

  api:
    build:
      <<: *python-build
      dockerfile: services/api/Dockerfile
    environment:
      <<: *app-environment
      SENTRY_DSN: ${SENTRY_DSN_API:-}
      TP_CORS_ORIGINS: ${TP_CORS_ORIGINS:-http://localhost:5173}
      # Telegram linking (optional): the API stores chat ids encrypted and verifies the webhook.
      TP_TELEGRAM_BOT_USERNAME: ${TP_TELEGRAM_BOT_USERNAME:-}
      TP_TELEGRAM_WEBHOOK_SECRET: ${TP_TELEGRAM_WEBHOOK_SECRET:-}
      TP_TELEGRAM_CHAT_HASH_KEY: ${TP_TELEGRAM_CHAT_HASH_KEY:-}
      TP_FIELD_ENCRYPTION_KEY: ${TP_FIELD_ENCRYPTION_KEY:-}
      # Notification email unsubscribe links (at least 32 bytes); without it the endpoint is 503.
      TP_EMAIL_UNSUBSCRIBE_KEY: ${TP_EMAIL_UNSUBSCRIBE_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:8000:8000'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [public, internal]

  worker:
    build:
      <<: *python-build
      dockerfile: services/worker/Dockerfile
    command:
      [
        'celery',
        '-A',
        'treasurypilot_worker.celery_app:app',
        'worker',
        '--loglevel=INFO',
        '--queues=core',
        '--hostname=core@%h',
      ]
    environment:
      <<: *app-environment
      SENTRY_DSN: ${SENTRY_DSN_WORKER:-}
      # Prometheus /metrics on the internal network only; prefork children share the tmpfs dir.
      TP_METRICS_PORT: '9100'
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
      CHAIN_RPC_URL: http://anvil:8545
      # Core-only credentials are deliberately not part of x-app-environment.
      TP_POLICY_KEYSTORE_PATH: /run/secrets/policy_keystore
      TP_POLICY_KEYSTORE_PASSWORD_FILE: /run/secrets/policy_keystore_password
      TP_SIGNER_SHARED_SECRET: ${TP_SIGNER_SHARED_SECRET:-}
    # Encrypted policy key (M08 §10); only the core worker mounts it.
    secrets: [policy_keystore, policy_keystore_password]
    tmpfs: [/tmp/prometheus]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal]

  worker-ai:
    build:
      <<: *python-build
      dockerfile: services/worker/Dockerfile
    command:
      [
        'celery',
        '-A',
        'treasurypilot_worker.celery_app:app',
        'worker',
        '--loglevel=INFO',
        '--queues=ai',
        '--hostname=ai@%h',
      ]
    environment:
      # Keep this an explicit allowlist: never merge x-app-environment or core secrets here.
      TP_ENVIRONMENT: local
      TP_REDIS_URL: redis://redis:6379/0
      # Empty means no DB access; when needed, provide a URL for a least-privilege AI role.
      DATABASE_URL: ${AI_DATABASE_URL:-}
      # Invoice extraction reads uploaded documents; local-only, reuses the MinIO root credentials.
      # Deployments must set a read-only app key for the documents bucket.
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${MINIO_BUCKET:?set MINIO_BUCKET}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Secondary LLM provider (AGT-017); unset means no failover.
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      AWS_REGION: ${AWS_REGION:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      SENTRY_DSN: ${SENTRY_DSN_WORKER:-}
      TP_METRICS_PORT: '9100'
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    tmpfs: [/tmp/prometheus]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [public, internal]

  # Sends signed webhooks, Telegram, Slack/Lark/WeCom messages and notification email to
  # external HTTPS endpoints, so it is the only worker besides worker-ai on the public network.
  # Explicit allowlist: no policy keystore, signer secret or object-store credentials; the
  # webhook sender rejects non-public addresses.
  worker-webhooks:
    build:
      <<: *python-build
      dockerfile: services/worker/Dockerfile
    command:
      [
        'celery',
        '-A',
        'treasurypilot_worker.celery_app:app',
        'worker',
        '--loglevel=INFO',
        '--queues=webhooks',
        '--hostname=webhooks@%h',
      ]
    environment:
      TP_ENVIRONMENT: local
      TP_REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
      TP_FIELD_ENCRYPTION_KEY: ${TP_FIELD_ENCRYPTION_KEY:-}
      # Telegram delivery (optional) also needs egress, so it runs here, not on the core worker.
      TP_TELEGRAM_BOT_TOKEN: ${TP_TELEGRAM_BOT_TOKEN:-}
      TP_APP_BASE_URL: ${TP_APP_BASE_URL:-http://localhost:5173}
      # Notification email (optional) calls Resend, so it also runs here. The dedicated key only
      # signs List-Unsubscribe links and must match the API's; never share the session secret.
      TP_RESEND_API_KEY: ${TP_RESEND_API_KEY:-}
      TP_RESEND_FROM_EMAIL: ${TP_RESEND_FROM_EMAIL:-}
      TP_EMAIL_UNSUBSCRIBE_KEY: ${TP_EMAIL_UNSUBSCRIBE_KEY:-}
      TP_PUBLIC_API_BASE_URL: ${TP_PUBLIC_API_BASE_URL:-http://localhost:8000}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      SENTRY_DSN: ${SENTRY_DSN_WORKER:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [public, internal]

  beat:
    build:
      <<: *python-build
      dockerfile: services/worker/Dockerfile
    command:
      [
        'celery',
        '-A',
        'treasurypilot_worker.celery_app:app',
        'beat',
        '--loglevel=INFO',
        '--schedule=/tmp/celerybeat-schedule',
      ]
    environment:
      <<: *app-environment
      SENTRY_DSN: ${SENTRY_DSN_WORKER:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal]

  signer:
    build:
      <<: *python-build
      dockerfile: services/signer/Dockerfile
    environment:
      TP_ENVIRONMENT: local
      CHAIN_RPC_URL: http://anvil:8545
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      SENTRY_DSN: ${SENTRY_DSN_SIGNER:-}
      TP_TELEGRAM_BOT_TOKEN: ${TP_TELEGRAM_BOT_TOKEN:-}
      TP_TELEGRAM_ALERT_CHAT_ID: ${TP_TELEGRAM_ALERT_CHAT_ID:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [internal]

  # Local trace UI on :16686; set OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 to send spans.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    profiles: [observability]
    ports:
      - '127.0.0.1:16686:16686'
    restart: unless-stopped
    networks: [public, internal]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_CHAIN_ID: '31337'
        VITE_RPC_URL: http://localhost:8545
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:5173:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1/healthz']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [public, internal]

secrets:
  # Unset paths mount /dev/null: the worker starts, but attest fails closed (no policy key).
  policy_keystore:
    file: ${TP_POLICY_KEYSTORE_FILE:-/dev/null}
  policy_keystore_password:
    file: ${TP_POLICY_KEYSTORE_PASSWORD_FILE:-/dev/null}

networks:
  public:
  internal:
    internal: true

volumes:
  postgres-data:
  minio-data:
