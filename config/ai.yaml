# AI adapter configuration (docs/modules/agent/README.md §9). Loaded by worker-ai at startup;
# override the path with TP_AI_CONFIG_PATH. Switching a task's model is a change here only.

# Per-organisation monthly cap (M09-D10). Over budget -> AiBudgetExceeded -> task fallback.
monthly_budget_usd_micros: 20_000_000  # 20 USD

# Provider failover order (AGT-017, FR-808). Every call goes to the first provider; when it is
# unavailable (outage, 5xx, rate limit, revoked key) the same turn moves to the next one within
# the task deadline. model_prefix maps a task model to the provider's model id. A provider whose
# credentials are unset is skipped with a warning: ANTHROPIC_API_KEY for anthropic,
# AWS_BEARER_TOKEN_BEDROCK and AWS_REGION for bedrock.
# shortcut: Bedrock spend is counted at the first-party prices below; add per-provider prices
# if Bedrock pricing diverges or failover traffic becomes significant.
providers:
  - name: anthropic
  - name: bedrock
    model_prefix: anthropic.

# USD micros per million tokens, from https://platform.claude.com/docs/en/about-claude/pricing
# (checked 2026-10-11). cache_write is the 5-minute cache write price.
prices:
  claude-opus-5-5:
    input: 4_000_000
    output: 20_000_000
    cache_write: 5_000_000
    cache_read: 200_000
  claude-sonnet-5-5:
    input: 2_000_000
    output: 10_000_000
    cache_write: 2_500_000
    cache_read: 100_000
  claude-haiku-5-5:
    input: 100_000
    output: 500_000
    cache_write: 125_000
    cache_read: 10_000
    long_prompt:
      threshold_tokens: 100_000
      input: 500_000
      output: 2_500_000
      cache_write: 625_000
      cache_read: 50_000

# timeout_s is a wall-clock deadline for the whole call (tool turns and retries included).
tasks:
  EXTRACT:
    model: claude-sonnet-5-5
    timeout_s: 60
    max_output_tokens: 2_000
  TERMS:
    model: claude-sonnet-5-5
    timeout_s: 60
    max_output_tokens: 2_000
  ANOMALY:
    model: claude-sonnet-5-5
    timeout_s: 60
    max_output_tokens: 2_000
  PLAN:
    model: claude-opus-5-5
    timeout_s: 20
    max_output_tokens: 1_500
    max_tool_calls: 8
    tool_result_max_bytes: 50_000
  EXPLAIN:
    model: claude-haiku-5-5
    timeout_s: 10
    max_output_tokens: 300
  EXCEPTION_DRAFT:
    model: claude-sonnet-5-5
    timeout_s: 20
    max_output_tokens: 800
  COPILOT:
    model: claude-sonnet-5-5
    timeout_s: 30
    max_output_tokens: 1_200
    max_tool_calls: 6
    tool_result_max_bytes: 50_000
  EVAL:
    model: claude-sonnet-5-5
    timeout_s: 60
    max_output_tokens: 2_000
